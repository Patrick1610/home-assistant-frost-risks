name: Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.9.0 pytest==9.0.3 pytest-homeassistant-custom-component==0.13.363 ruff==0.16.7
      - run: python -m pytest -q
      - run: python -m ruff check custom_components tests
      - run: python -m ruff format --check custom_components tests
